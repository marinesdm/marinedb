name: Website construction and deployment

on:
  push:
    branches:
      - main

jobs:

  website:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Get the source code
        uses: actions/checkout@v7

      #############################
      # Generate the website
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependencies 
        run: pip install zensical mkdocstrings-python

      - name: Install the marinedb library
        run: pip install .

      - name: Build the website
        run: zensical build --clean

      # By default, the upload pages artifacts looks into _site
      - name: Upload github pages artifcats
        uses: actions/upload-pages-artifact@v5
        with:
          path: site


  deploy:
    runs-on: ubuntu-latest
    needs: [website]

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 
