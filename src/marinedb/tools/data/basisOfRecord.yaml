basisOfRecord_mapping:

  # source n° 1: https://github.com/gbif/parsers/blob/dev/src/main/resources/dictionaries/parse/basisOfRecord.tsv
  # OBIS basisOfRecord values & source n°2: https://github.com/gbif/gbif-api/issues/84

  # PRESERVED_SPECIMEN:  a speciment that has been preserved 
  #                      e.g., plant on an herbarium shett, cataloged lot of fish in a jar
  # LIVING_SPECIMEN:     a specimen that is alive
  #                      e.g., living plant in a botanical garden, living animal in a zoo
  # MATERIAL_CITATION:   a reference to, or citation of, one, a part of, or multiple specimens in scholarly publications
  #                      e.g., citation of a physical specimen from a scientific collection, occurrence mentioned in a field note book
  # MATERIAL_SAMPLE:     an output of a sampling (or subsampling) event
  # MACHINE_OBSERVATION: an output of a machine observation process (ongoing debate)
  #                      e.g., photograph, video, audio recording, remote sensing image, occurrence record based on telemetry
  # HUMAN_OBSERVATION:   an output of human observation process without physical evidence taken
  #                      e.g., evidence of an occurrence taken from field notes or literature, records of an occurence without physical evidence nor evidence captured with a machine
  # OBSERVATION:         superset of machine and human observations OR pure "sightings" that do not collect physical material
  # OCCURRENCE:          catch-all value when the resource type is unknown, existence of an organism at a particular place at a particular time
  # FOSSIL_SPECIMEN:     a preserved specimen that is a fossil 
  #                      e.g., body fossil, coprolite, gastrolith, ichnofossil, piece of petrified tree
  # source: https://rs.gbif.org/vocabulary/dwc/basis_of_record.xml

