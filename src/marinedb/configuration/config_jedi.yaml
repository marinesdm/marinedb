data:

  inputfile_path: "/data/dream/zrr/elena/data/JeDI.csv"

  inputdir_path: "/data/dream/zrr/elena/jedi_marinedb/source"

  outputdir_path: "/data/dream/zrr/elena/jedi_marinedb/curated"

  outputfile_path: "jedi_processedby_marinedb.txt"

  processing:
    - tool:
        - format:
            dataset_name: 'jedi'
            overwrite: False
    - tool:
        - marineloc:
            latkey: 'decimalLatitude'
            lonkey: 'decimalLongitude'
            split_type: 'pandas'
            parallel: True
            filterfile: '/data/dream/zrr/elena/jedi_marinedb/source/marineloc/processed/marine_filter'
    - scientificName:
        - createwormsfilters:
            skip_uniques_rebuild: True
            wormscall:
              - 'AphiaID'
              - 'scientificname'
              - 'genus'
              - 'family'
              - 'order'
              - 'cls'
              - 'phylum'
              - 'kingdom'
              - 'match_type'
              - 'status'
              - 'valid_AphiaID'
              - 'lsid'
              - 'isMarine'
              - 'isBrackish'
              - 'authority'
            doublecheck: True
            overwrite: True
            overwrite_parallel: True
            resume: True
            resume_parallel: True
            parallel: True
            max_attempt: 20
        - isinworms:
            stdnan: True
            rank_mapping:
              scientificname: 'scientificName'
              genus: 'genus'
              family: 'family'
              order: 'order'
              cls: 'class'
              phylum: 'phylum'
              kingdom: 'kingdom'
            worms_dtypes:
              AphiaID: 'Int64'
              match_type: 'string'
              status: 'string'
              valid_AphiaID: 'Int64'
              lsid: 'string'
              isMarine: 'Int64'
              isBrackish: 'Int64'
              authority: 'string'
            check_ambiguity: True
            uncertainty_level: 3
            fuzzy: True
            keep_fossil: False
            inplace: True
            resume: True
            resume_parallel: True
            resume_mode: 'soft'
            parallel: True
            flag_nomatch: False
            flag_uncertain: False
            store_isinworms: False
    - kingdom:
        - notisin:
            values: ['Bacteria', 'Archaea', 'Viruses']
            flag: False
    - class:
        - isin:
            values: ['Aves']
            flag: True
    - status_generatedby_isinworms:
        - notisin:
            values:
              - 'accepted'
              - 'alternative representation'
              - 'unaccepted'
              - 'unreplaced junior homonym'
              - 'junior homonym'
              - 'superseded combination'
              - 'superseded rank'
            flag: True
            minimize_flagname: True
            flagname_mapping:
              'accepted': 0
              'alternative representation': 1
              'unaccepted': 2
              'unreplaced junior homonym': 3
              'junior homonym': 4
              'superseded combination': 5
              'superseded rank': 6
    - samplingProtocol:
        - mapbasisofrecord:
            inplace: False
        - doesnotcontain:
            values: 'FOSSIL'
            flag: False
    - occurrenceStatus:
        - isin:
            values: 'absent'
            flag: True
            dropna: True
    - tool:
        - islatloninvalid:
            latkey: 'decimalLatitude'
            lonkey: 'decimalLongitude'
            flag: False
            dropna: True
        - islatlonzero:
            latkey: 'decimalLatitude'
            lonkey: 'decimalLongitude'
            flag: False
        - doeslateqlon:
            latkey: 'decimalLatitude'
            lonkey: 'decimalLongitude'
            flag: False
        - belowminlatlonprecision:
            latkey: 'decimalLatitude'
            lonkey: 'decimalLongitude'
            value: 2
            flag: False
#    - marinedb_mask: # coast
#        - isin:
#            values: 2
#            flag: True
    - tool:
        - temporal:
            # parse dates
            datekey: 'eventDate'
            yearkey: 'year'
            monthkey: 'month'
            daykey: 'day'
            inplace_parse: True
            stdnan: True
            # process date intervals
            flag_interval: True
            drop_interval: False
            strategy_interval: 'overlap'
            inplace_interval: False
            # split dates
            split_date: 'all'
            drop_mismatch_split: True
            inplace_split: True
            dropna_date: True
        - isdateunlikely:
            yearkey: 'year'
            year_max: 2014
            flag: False
    - year:
        - isna:
            flag: False
        - isboundedby:
            operator: '<'
            value: 1950
            flag: True

  variables:

    - jedi_id:
        jedi_id: 'int'
    - decimalLatitude:
        decimalLatitude: 'float'
    - decimalLongitude:
        decimalLongitude: 'float'
    - eventDate
    - year:
        year: 'int'
    - month:
        month: 'int'
    - day:
        day: 'int'
#    - verbatimDepth:
#        verbatimDepth: 'float'
#    - minimumDepthInMeters:
#        minimumDepthInMeters: 'float'
#    - maximumDepthInMeters:
#        maximumDepthInMeters: 'float'
    - scientificName:
        species: 'str'
    - genus
    - family
    - order
    - class
    - phylum
    - kingdom
    - basisOfRecord
    - flag_occurrenceStatus_isin_absent:
        flag_absence: 'bool'
    - flag_status_generatedby_isinworms_notisin_0-1-2-3-4-5-6:
        flag_status_generatedby_isinworms_notfitforuse: 'bool'
    - collectionCode        # OBIS/GBIF/JeDI overlap
    - ownerInstitutionCode  # OBIS/GBIF/JeDI overlap

  postprocessing:
    - tool:
      - resolvetaxamatch:
          review_level: 3
    - tool:
      - taxasubset:
          lowerbound: 50
          flag: True
          dropna: True
