[project]
site_name= "MarineDB"
site_url= "https://smartbiodiv.pages.centralesupelec.fr/sdm-data/"
repo_name = "MarineDB"
repo_url= "https://gitlab-research.centralesupelec.fr/smartbiodiv/sdm-data"
copyright = "<p xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:dct=\"http://purl.org/dc/terms/\"><a property=\"dct:title\" rel=\"cc:attributionURL\" href=\"https://cool.com/\">Marinedb</a> by <a rel=\"cc:attributionURL dct:creator\" property=\"cc:attributionName\" href=\"https://elena.berhocoirigoin.io\">Elena Berhocoirigoin</a> is licensed under <a href=\"https://creativecommons.org/licenses/by-sa/4.0/?ref=chooser-v1\" target=\"_blank\" rel=\"license noopener noreferrer\" style=\"display:inline-block;\">CC BY-SA 4.0<img style=\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\" src=\"https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1\" alt=\"\"><img style=\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\" src=\"https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1\" alt=\"\"><img style=\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\" src=\"https://mirrors.creativecommons.org/presskit/icons/sa.svg?ref=chooser-v1\" alt=\"\"></a></p>"

extra_javascript = [
	"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
]

nav = [
{ "Home" = "index.md" },
{ "API" = [
  { "Overview" = "api/index.md" },
  { "Spatial" = [
    { "Overview" = "api/spatial/index.md"},
    { "Does Lat eq lon"= "api/spatial/doeslateqlon.md"},
    { "Is Zero" = "api/spatial/iszero.md"}
  ]},
  { "Taxonomic" = [
    { "Overview" = "api/taxonomic/index.md"},
    { "Worms"= "api/taxonomic/isinworms.md"},
  ]},
  { "Demo" = "api/docstring-demo.md"}
]}
]

[project.theme]
palette.primary = "orange"
palette.scheme = "slate"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_root_members_full_path = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
