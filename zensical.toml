extra_javascript = [
	"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
]

nav = [
{ "Home" = "index.md" },
{ "API" = [
  { "Overview" = "api/index.md" },
  { "Pre-processing" = "api/format.md" },
  { "Generic" = [
    { "Overview" = "api/generic/index.md"},
    { "Does not contain" = "api/generic/doesnotcontain.md"},
    { "Contains" = "api/generic/contains.md"},
    { "Is in" = "api/generic/isin.md"},
    { "Is not in" = "api/generic/notisin.md"},
    { "Is missing" = "api/generic/isna.md"},
    { "Is bounded by" = "api/generic/isboundedby.md"}
  ]},
  { "Spatial" = [
    { "Overview" = "api/spatial/index.md"},
    { "Invalid coordinates"= "api/spatial/islatloninvalid.md"},
    { "Zero-valued coordinates" = "api/spatial/islatlonzero.md"},
    { "Equal latitude and longitude"= "api/spatial/doeslateqlon.md"},
    { "Low coordinate precision"= "api/spatial/belowminlatlonprecision.md"},
    { "Advanced utilities" = "api/spatial/advanced.md"},
    { "Land-sea filtering" = [
      { "Overview" = "api/spatial/marineloc/index.md"},
      { "1. File splitting" = "api/spatial/marineloc/split_pandas_parquet.md"},
      { "2.1 Land-sea classification" = "api/spatial/marineloc/island.md"},
      { "2.2 Distributed land-sea classification" = "api/spatial/marineloc/parallel_island.md"},
      { "3. Marine-filter creation" = "api/spatial/marineloc/createmarinefilter.md"},
      { "4. Marine-record filtering" = "api/spatial/marineloc/filtermarinelocations.md"},
      { "Integrated land-sea filtering" = "api/spatial/marineloc/marineloc.md"},
  ]},
  ]},
    { "Temporal" = [
    { "Overview" = "api/temporal/index.md"},
    { "1. Date standardization"= "api/temporal/parsedate.md"},
    { "2. Date-interval processing"= "api/temporal/processdateinterval.md"},
    { "3. Date-component extraction"= "api/temporal/splitdate.md"},
    { "Integrated temporal data curation"= "api/temporal/temporal.md"},
    { "Invalid date"= "api/temporal/isdateinvalid.md"},
    { "Unlikely date"= "api/temporal/isdateunlikely.md"},
  ]},
  { "Taxonomic" = [
    { "Overview" = "api/taxonomic/index.md"},
    { "1. WoRMS filter creation"= "api/taxonomic/createwormsfilters.md"},
    { "2. Taxonomic harmonization"= "api/taxonomic/isinworms.md"},
    { "3. Manual taxonomic resolution" = "api/taxonomic/resolvetaxamatch.md"},
    { "Non-alphabetic taxon names" = "api/taxonomic/lettersonly.md" },
    { "Basis of record" = [
      { "Standardization" = "api/taxonomic/mapbasisofrecord.md" },
      { "Filtering" = "api/taxonomic/basisofrecordisin.md" },
    ]},
    { "Taxon representation" = "api/taxonomic/taxasubset.md" },
  ]},
  { "Resources" = "api/resources.md" },
]}
]

[project.theme]
palette.primary = "orange"
palette.scheme = "slate"

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_root_members_full_path = true
show_signature = false
line_length = 60

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.zensical.extensions.macros]
include_yaml = ["data/variables.yml"]
on_undefined = "strict"
